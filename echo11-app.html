<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>echo.|| — Frequency Wellness App</title>

<!-- All relative URLs resolve to the project/ directory -->
<base href="project/" />

<link rel="stylesheet" href="echo-styles.css" />
<link rel="stylesheet" href="echo-extra.css" />

<style>
  html, body {
    margin: 0;
    background: #08070a;
  }
  #root {
    width: 100%;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- React 18 -->
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<!-- Babel standalone — transforms JSX in the browser -->
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Supabase client (Auth + Database only — no audio storage) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="echo-config.js"></script>

<!-- App modules (load order matters: dependencies first) -->
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="echo-data.jsx"></script>
<script type="text/babel" src="echo-ui.jsx"></script>
<script type="text/babel" src="echo-screens-a.jsx"></script>
<script type="text/babel" src="echo-screens-b.jsx"></script>
<script type="text/babel" src="echo-frequencies.jsx"></script>
<script type="text/babel" src="echo-home.jsx"></script>
<script type="text/babel" src="echo-player.jsx"></script>
<script type="text/babel" src="echo-paywall.jsx"></script>
<script type="text/babel" src="echo-settings.jsx"></script>
<script type="text/babel" src="echo-supabase.jsx"></script>
<script type="text/babel" src="echo-app-unified.jsx"></script>
</body>
</html>
